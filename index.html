<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6" id="themeColor">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Taqarrub">
  <meta name="description" content="Taqarrub — prayer times, Quran, and duas.">
  <title>Taqarrub</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css?v=1">
  <script>
    try{
      var t=JSON.parse(localStorage.getItem('tq_theme')||'"system"');
      var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches);
      document.documentElement.dataset.theme=d?'dark':'light';
    }catch(e){}
  </script>
</head>
<body>
  <div id="app">
    <header class="top" id="top"></header>
    <main id="view" class="view"></main>
  </div>
  <div class="dock-scrim" aria-hidden="true"></div>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <div id="sheet" hidden></div>
  <audio id="player" preload="none"></audio>
  <script src="./app.js?v=1"></script>
</body>
</html>
